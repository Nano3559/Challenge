name: AI Test Generation

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module or OpenAPI tag to cover in this single batch
        required: true
        type: string
      base-ref:
        description: Branch to open the generated test PR against
        required: false
        default: main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      START_APP: 'true'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify AI provider credentials
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo 'Configure the repository secret ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN before running this workflow.' >&2
            exit 1
          fi

      - name: Install framework dependencies
        run: npm ci

      - name: Clone GAD
        run: git clone --depth 1 https://github.com/jaktestowac/gad-gui-api-demo.git gad-gui-api-demo

      - name: Install GAD dependencies
        run: npm --prefix gad-gui-api-demo ci

      - name: Generate one bounded test batch and open a PR
        id: ai
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ inputs.base-ref }}
          branch_prefix: ai-tests/
          branch_name_template: '{{prefix}}coverage-{{timestamp}}'
          use_sticky_comment: 'false'
          prompt: |
            Create exactly one small, logical batch of meaningful API tests for the requested module: `${{ inputs.module }}`.

            Before editing, read README.md, CLAUDE.md, .claude/skills/add-api-test/SKILL.md, the relevant OpenAPI specification, coverage-gaps.json, and the closest existing tests. Inspect only the related application handler and fixtures needed to understand the behavior. GAD under gad-gui-api-demo is read-only: never edit it or production code.

            Use the existing Playwright/TypeScript clients, fixtures, builders, schemas, tags, and assertions. Do not duplicate existing assertions, weaken assertions, skip tests, or add tests that only execute code. Limit this batch to at most 5 new tests in the selected module. Prefer critical behavior, error handling, boundaries, and branches represented by the current coverage gaps. Document contract mismatches instead of asserting behavior GAD does not produce.

            Execute the generated test file and the closest relevant existing test file, then npm run ci:check. If a test fails, inspect the failure and make at most one focused correction pass. Do not modify production code to make a generated test pass. Re-record coverage for the changed module with --keep, regenerate the OpenAPI baseline, and calculate the before/after delta from the committed base reports.

            Create a dedicated branch with the configured ai-tests/ prefix and commit only this batch. Write `AI_TEST_GENERATION_SUMMARY.md` at the repository root with module, number of tests, initial/final OpenAPI coverage, delta, test execution results, and remaining gaps. The workflow will open (but never merge) the pull request against `${{ inputs.base-ref }}` using that file as its PR description. If no meaningful tests can be generated without changing GAD or weakening assertions, explain that and do not create an empty commit.
          claude_args: |
            --max-turns 8

      - name: Checkout generated test branch
        if: steps.ai.outputs.branch_name != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ai.outputs.branch_name }}
          path: generated
          token: ${{ github.token }}

      - name: Create or update the generated-test pull request
        if: steps.ai.outputs.branch_name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.ai.outputs.branch_name }}
          BASE_BRANCH: ${{ inputs.base-ref }}
          MODULE: ${{ inputs.module }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY_FILE="generated/AI_TEST_GENERATION_SUMMARY.md"
          if [ ! -f "$BODY_FILE" ]; then
            echo 'AI_TEST_GENERATION_SUMMARY.md is missing; refusing to open a PR without coverage evidence.' >&2
            exit 1
          fi
          printf '\n\nAI workflow run: %s\n' "$RUN_URL" >> "$BODY_FILE"
          if gh pr view "$HEAD_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$HEAD_BRANCH" --title "test: AI coverage batch for $MODULE" --body-file "$BODY_FILE"
          else
            gh pr create --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --title "test: AI coverage batch for $MODULE" --body-file "$BODY_FILE"
          fi
