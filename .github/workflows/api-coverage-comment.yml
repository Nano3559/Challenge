name: API Coverage PR Comment

on:
  workflow_run:
    workflows: ['API Coverage']
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download comparison report
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: api-coverage-comparison
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: coverage-comparison

      - name: Update the existing API coverage comment
        if: always()
        uses: actions/github-script@v7
        env:
          ARTIFACT_STATUS: ${{ steps.artifact.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- api-coverage-report -->';
            const run = context.payload.workflow_run;
            let prs = run.pull_requests || [];
            if (prs.length === 0 && run.head_sha) {
              const response = await github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
                owner: context.repo.owner, repo: context.repo.repo, commit_sha: run.head_sha,
              });
              prs = response.data;
            }
            if (!prs.length) {
              core.notice('No associated pull request was found; coverage artifact remains attached to the workflow run.');
              return;
            }
            const reportPath = 'coverage-comparison/summary.md';
            const report = process.env.ARTIFACT_STATUS === 'success' && fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : '## Coverage comparison\n\n**Measurement failed:** the HTML comparison artifact could not be downloaded. Check the [workflow run](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + run.id + ').';
            const body = marker + '\n\n' + report + '\n\n_Updated by API Coverage workflow._';
            const issue_number = prs[0].number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
              core.info(`Updated API coverage comment on PR #${issue_number}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body,
              });
              core.info(`Created API coverage comment on PR #${issue_number}.`);
            }
